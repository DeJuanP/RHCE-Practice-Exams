---
# tasks file for common
- name: Install common packages
  ansible.builtin.dnf:
   name: "{{item }}"
   state: present
  loop: "{{ packages }}"

- name: Install chrony
  ansible.builtin.dnf:
   name: chrony
   state: present

- name: Start and enable chrony
  ansible.builtin.service:
   name: chronyd
   state: started
   enabled: yes

- name: Set timezone to UTC
  community.general.timezone:
   name: UTC

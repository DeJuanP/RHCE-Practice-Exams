---
- name: Storage Configuration
  hosts: databases
  become: true

  tasks:
   - name: Create volume group
     ansible.builtin.lvg:
      vg: vg_db
      pvs: /dev/sdb

   - name: Create logical group
     ansible.builtin.lvol:
      vg: vg_db
      lv: lv_data
      size: 5g

   - name: Format the logical volume
     community.general.filesystem:
      fstype: xfs
      dev: /dev/vg_db/lv_data

   - name: Create mount directory
     ansible.builtin.file:
      path: /data
      state: directory
      mode: '0755'

   - name: Mount logical volume
     ansible.posix.mount:
      path: /data
      src: /dev/vg_db/lv_data
      fstype: xfs
      state: mounted

   - name: Install mariadb
     ansible.builtin.dnf:
      name: mariadb-server
      state: present

   - name: Start and enable mariadb
     ansible.builtin.service:
      name: mariadb
      state: started
      enabled: yes

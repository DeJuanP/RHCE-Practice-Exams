---
- name: MOTD and Users
  hosts: prod
  become: true

  tasks:
   - name: Create user Automation
     ansible.builtin.user:
      name: automation
      password: "{{ automation_password }}"
      groups: wheel
      append: yes

   - name: Copy ssh keys
     ansible.posix.authorized_key:
      user: automation
      state: present
      key: "{{ lookup('file', '/home/ansible/rhce-ansible-practice/exam03/files/id_ed25519.pub') }}"

   - name: Give user automation sudo priv
     ansible.builtin.copy:
      dest: /etc/sudoers.d/automation
      content: |
       automation  ALL=(ALL)   NOPASSWD: ALL
      validate: /usr/sbin/visudo -csf %s
      mode: "0640"

   - name: Create MOTD
     ansible.builtin.copy:
      dest: /etc/motd
      content: |
       Welcome to {{ ansible_hostname }} - Managed by Ansible
       {% if 'databases' in group_names %}
        Database Server
       {% endif %}
      mode: "0644"

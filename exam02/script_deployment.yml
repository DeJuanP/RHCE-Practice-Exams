---
- name: Shell Script Analysis
  hosts: managed
  become: true

  tasks:
   - name: Copy script
     ansible.builtin.copy:
      src: files/system_check.sh
      dest: /usr/local/bin/system_check
      owner: root
      group: root
      mode: '0755'

   - name: Execute script
     ansible.builtin.command: /usr/local/bin/system_check
     register: script_var

   - name: Display script variable
     ansible.builtin.debug:
      var: script_var
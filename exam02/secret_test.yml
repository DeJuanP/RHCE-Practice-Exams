---
- name: Secret Task
  hosts: node3
  become: true
  vars_files:
   - vault_secrets.yml

  tasks:
   - name: Create database Secret
     ansible.builtin.copy:
      dest: /root/database-secret
      owner: root
      group: root
      content: |
       {{ db_admin_password }}
      mode: '0644'
     no_log: true